server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    # Docker embedded DNS — заставляет nginx ПЕРЕ-резолвить IP контейнера `server`
    # после каждого редеплоя. Без этого nginx кешировал старый IP при старте, и
    # после пересоздания server'а /api отваливался (статика при этом работала).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Service worker и точка входа НЕ кешируются. Без этого Cloudflare держал
    # sw.js до 4 часов (max-age=14400, cf-cache-status: HIT), устройства
    # получали воркер со старым precache-манифестом и продолжали крутить
    # предыдущую сборку — фикс, выкаченный в прод, не доезжал до раций и
    # телефонов часами. index.html по той же причине должен быть свежим: он
    # ссылается на хеши бандлов.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        expires off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # Бандлы содержат хеш в имени, поэтому их можно кешировать навсегда:
    # при новой сборке меняется имя файла, а не содержимое старого.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Проверка принадлежности приложения сайту (Android App Links, позже —
    # Universal Links для iOS). Android читает этот файл при установке, поэтому
    # кешировать его надолго нельзя: сменится ключ подписи — проверка застрянет
    # на старом отпечатке.
    location /.well-known/ {
        add_header Cache-Control "no-cache" always;
        default_type application/json;
        try_files $uri =404;
    }

    # Файлы раздачи — только реальные файлы. Без этого несуществующий APK
    # уезжал в общий SPA-fallback и отдавался как index.html с кодом 200:
    # человек по старой ссылке скачивал полторы килобайты HTML под видом
    # приложения и получал «приложение не установлено».
    location /downloads/ {
        try_files $uri =404;
    }

    # SPA: все неизвестные пути → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Server health (mediasoup status etc)
    location /health {
        set $backend server;
        proxy_pass         http://$backend:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # REST API → backend
    location /api/ {
        set $backend server;
        proxy_pass         http://$backend:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Socket.io + WebSocket upgrade → backend
    location /socket.io/ {
        set $backend server;
        proxy_pass         http://$backend:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }
}
